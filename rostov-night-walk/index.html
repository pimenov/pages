// Each repeatable surface carries pigment, height and a tangent-space slope map.
// The last layer is periodic, band-limited noise shared by water, clouds and vapour.
const BRICK=0,PLASTER=1,STONE=2,IRON=3,WOOD=4,ASPHALT=5,SETTS=6,NOISE=7,INK=8,GLASS=9,GLOW=10;

function surfaceTextures(){

  const mineral=148+(broad-.5)*37+(mid-.5)*26+grit*24;
  put(STONE,mineral,mineral*.96,mineral*.86,.48+(mid-.5)*.29+grit*.26);
  const rust=ease(.64,.80,mid*.68+f*.32),met=116+vein*18+grit*11;
  put(IRON,met+rust*19,met*.99-rust*28,met*.97-rust*44,.49+(vein-.5)*.13+rust*.34+grit*.13);

  put(WOOD,wood,wood*.72,wood*.49,.35+fibres*.31+vein*.16);
  const chip=ease(.81,.98,speck),agg=54+mid*15+grit*18+chip*21;
  put(ASPHALT,agg*1.01,agg*1.015,agg, .30+f*.21+speck*.21+chip*.10);
  const cy=v*15+(mid-.5)*.16+(f-.5)*.08,cr=Math.floor(cy);
  const cx=u*8+(cr%2)*.5+.17*(ih(16,(cr+15)%15)-.5)+(mid-.5)*.12,cc=Math.floor(cx);

const [surfaceMap,slopeMap]=surfaceTextures();
// An alley-length wear map keeps tar repairs independent of the repeating aggregate.
function roadWearTexture(){

// Original shop graphics, enamel and printed matter are drawn into one local atlas.

const sans='600 @ Arial, sans-serif',serif='@ Georgia, "Times New Roman", serif', mono='@ Menlo, monospace';

}
captureEnvironment();playback();requestAnimationFrame(animate);
} catch(error){
 console.error(error);status.hidden=false;status.textContent='The alley could not be rendered. '+error.message;document.getElementById('transport').style.display='none';
}
})();
</script>

<script>
(function () {
  function tuckFooter() {
    var foot = document.querySelector("[data-lab-footer]");
    if (!foot || document.querySelector(".lab-scene-foot")) return;
    var wrap = document.createElement("div");
    wrap.className = "lab-scene-foot";
    wrap.innerHTML = '<button type="button" class="lab-scene-foot__btn" aria-expanded="false" aria-controls="lab-scene-foot-panel" title="Ссылки лаборатории" aria-label="Ссылки лаборатории">i</button><div id="lab-scene-foot-panel" class="lab-scene-foot__panel" hidden></div>';
    var panel = wrap.querySelector(".lab-scene-foot__panel");
    var btn = wrap.querySelector("button");
    document.body.appendChild(wrap);
    panel.appendChild(foot);
    btn.addEventListener("click", function () {
      var open = panel.hasAttribute("hidden");
      if (open) panel.removeAttribute("hidden");
      else panel.setAttribute("hidden", "");
      btn.setAttribute("aria-expanded", String(open));
    });
    var hide = 0;
    function reveal(delay) {
      if (delay == null) delay = 2200;
      wrap.classList.remove("idle");
      clearTimeout(hide);
      hide = setTimeout(function () {
        if (panel.hasAttribute("hidden") && !wrap.matches(":hover, :focus-within")) wrap.classList.add("idle");
      }, delay);
    }
    window.addEventListener("pointerdown", function () { reveal(); });
    window.addEventListener("pointermove", function () { reveal(); });
    window.addEventListener("keydown", function () { reveal(); });
    reveal();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", tuckFooter);
  else tuckFooter();
})();
</script>
