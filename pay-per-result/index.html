<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" id="theme-color" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function () {
        var ok = { light: 1, dark: 1, cyberpunk: 1 };
        var theme = "light";
        try {
          var saved = localStorage.getItem("lab-theme");
          if (!ok[saved]) saved = localStorage.getItem("ppr-theme");
          if (ok[saved]) theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
        var meta = document.getElementById("theme-color");
        if (meta) meta.setAttribute("content", { light: "#ffffff", dark: "#08090c", cyberpunk: "#fff248" }[theme]);
      })();
    </script>
    <style>
      html { background: #08090c; }
      html[data-theme="light"] { background: #ffffff; }
      html[data-theme="cyberpunk"] { background: #fff248; }
    </style>

    />
