<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#08090c" id="theme-color" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("ppr-theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
        var meta = document.getElementById("theme-color");
        if (meta) meta.setAttribute("content", theme === "light" ? "#ffffff" : "#08090c");
      })();
    </script>
    <style>
      html { background: #08090c; }
      html[data-theme="light"] { background: #ffffff; }
    </style>
    <title>Платить за токены или за результат?</title>
    <meta
      name="description"
      content="Калькулятор: сравните оплату за токены и оплату за результат. Примерные цифры, подставьте свои. Цена за результат для заказчика стоит на месте, а маржа поставщика растёт, когда токены дешевеют."
    />
