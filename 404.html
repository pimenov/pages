<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="lab-themes" content="light" />
    <script>
      /* lab-chrome: тема до отрисовки по контракту страницы (meta lab-themes / lab-theme-owner).
         Сохранённый выбор lab-theme не перезаписывается: недоступная тема заменяется ближайшей. */
      (function () {
        var r = document.documentElement;
        function m(n) { var e = document.querySelector('meta[name="' + n + '"]'); return e ? e.getAttribute("content") || "" : null; }
        if (m("lab-theme-owner") === "page") return;
        var raw = m("lab-themes"), list = (raw === null ? "light dark" : raw).split(/[\s,]+/), t = null;
        try { t = localStorage.getItem("lab-theme"); } catch (e) {}
        if (list.indexOf(t) < 0) t = t === "cyberpunk" && list.indexOf("dark") >= 0 ? "dark" : list.indexOf("light") >= 0 ? "light" : list[0];
        r.setAttribute("data-theme", t);
        r.setAttribute("data-lab-scheme", t === "dark" ? "dark" : "light");
        r.style.colorScheme = t === "dark" ? "dark" : "light";
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Страница не найдена</title>
    <script>
      // GitHub Pages отдаёт только корневой 404.html на любой несуществующий путь.
      // Редирект только для /soviet-ai/… → /soviet-ai/#/…, query и hash сохраняются внутри фрагмента,
      // потому что HashRouter читает маршрут из location.hash, а не из location.search.
      function sovietAiHashTarget(pathname, search, hash) {
        var prefix = "/soviet-ai";
        if (pathname !== prefix && pathname.indexOf(prefix + "/") !== 0) return "";
        var rest = pathname.slice(prefix.length).replace(/\/+$/, "");
        if (!rest) rest = "/";
        if (rest.charAt(0) !== "/") rest = "/" + rest;
        return prefix + "/#" + rest + (search || "") + (hash || "");
      }
      (function () {
        var target = sovietAiHashTarget(location.pathname, location.search, location.hash);
        if (target) location.replace(target);
      })();
    </script>
    <link rel="stylesheet" href="/lab-chrome/lab-chrome.css">
    <script src="/lab-chrome/lab-chrome.js" defer></script>
</head>
  <body style="margin: 0; padding: 48px 20px; font-family: system-ui, sans-serif; color: #171d39; background: #fff;">
    <p style="margin: 0; font-size: 18px;">Страница не найдена.</p>
  </body>
</html>
