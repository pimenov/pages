<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080d" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function () {
        var ok = { light: 1, dark: 1, cyberpunk: 1 };
        var theme = "light";
        try {
          var saved = localStorage.getItem("lab-theme");
          if (!ok[saved]) saved = localStorage.getItem("team-map-theme");
          if (ok[saved]) theme = saved;
        } catch (e) {}
        var color = { light: "#f3f6fb", dark: "#07080d", cyberpunk: "#fff248" }[theme];
        var scheme = theme === "dark" ? "dark" : "light";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = scheme;
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.setAttribute("content", scheme);
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.setAttribute("content", color);
          m.removeAttribute("media");
        });
      })();
    </script>
    <title>Команда Grok-ботов Сергея Пименова</title>
