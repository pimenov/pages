  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07080d" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("camera-moves-theme"); } catch (e) {}
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme;
        if (stored) {
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.setAttribute("content", theme === "light" ? "#f3f6fb" : "#07080d");
            meta.removeAttribute("media");
          });
        }
      })();
    </script>
