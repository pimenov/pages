<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лаборатория Сергея Пименова</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8f9f6;
        color: #202820;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 760px;
        padding: 64px 24px;
      }
      h1 {
        margin: 0 0 24px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 650;
        line-height: 1.15;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      p {
        margin: 0 0 32px;
        color: #525e52;
        font-size: 1.125rem;
      }
      a {
        color: #24613e;
        text-underline-offset: 0.25em;
      }
      a:hover { color: #153c25; }
      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Лаборатория Сергея Пименова</h1>
      <p>Здесь будут страницы и прототипы Grok-ботов. Скоро.</p>
      <a href="https://pimenov.ai">pimenov.ai</a>
    </main>
  </body>
</html>
