<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лаборатория Сергея Пименова</title>
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("lab-theme");
          if (saved === "light" || saved === "dark" || saved === "cyberpunk") theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme === "dark" ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="/lab-chrome/lab-chrome.css">
    <script src="/lab-chrome/lab-chrome.js" defer></script>
    <style>
      * { box-sizing: border-box; }
      :root {
        --page-paper: #f8f9f6;
        --page-ink: #202820;
        --page-muted: #525e52;
        --page-link: #24613e;
        --page-link-hover: #153c25;
      }
      :root[data-theme="dark"] {
        --page-paper: #0f1210;
        --page-ink: #eef2ec;
        --page-muted: #a9b5a9;
        --page-link: #8fd3a8;
        --page-link-hover: #b9e8c9;
      }
      /* Киберпанк: палитра :root[data-theme=cyberpunk] с pimenov.ai */
      :root[data-theme="cyberpunk"] {
        --page-paper: #fff248;
        --page-ink: #121024;
        --page-muted: #56445c;
        --page-link: #941342;
        --page-link-hover: #701034;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--page-paper);
        color: var(--page-ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 760px;
        padding: 64px 24px;
      }
      h1 {
        margin: 0 0 24px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        font-weight: 650;
        line-height: 1.15;
        letter-spacing: -0.035em;
        text-wrap: balance;
      }
      p {
        margin: 0 0 32px;
        color: var(--page-muted);
        font-size: 1.125rem;
      }
      a {
        color: var(--page-link);
        text-underline-offset: 0.25em;
      }
      a:hover { color: var(--page-link-hover); }
      .lab-top {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 5;
      }
      .home-tg { margin: 0 0 32px; }
      a:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 5px;
      }
    </style>
  </head>
  <body>
    <div class="lab-top" data-lab-theme-switch></div>
    <main>
      <h1>Лаборатория Сергея Пименова</h1>
      <p>Здесь будут страницы и прототипы Grok-ботов. Скоро.</p>
      <aside class="lab-tg home-tg" aria-label="Telegram-канал НИИ ИИ">
        <span class="lab-tg__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.7 3.3 2.6 10.3c-1.2.5-1.2 1.2-.2 1.5l4.6 1.4 1.8 5.4c.2.6.1.8.7.8.5 0 .7-.2 1-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8l3.1-14.6c.3-1.3-.5-1.8-1.3-1.5zM8.9 13l8.8-5.6c.4-.3.8-.1.5.2l-7.6 6.8-.3 3.3L8.9 13z"/></svg></span>
        <span class="lab-tg__text"><span class="lab-tg__title">Telegram-канал «НИИ&nbsp;ИИ»</span><span class="lab-tg__sub">Сергей Пименов о практическом ИИ</span></span>
        <a class="lab-tg__btn" href="https://t.me/ai_rostov" target="_blank" rel="noopener">Подписаться</a>
      </aside>
      <p><a href="/style-lab/">Витрина стилей роликов и подборщик</a></p>
      <a href="https://pimenov.ai">pimenov.ai</a>
    </main>
  </body>
</html>
